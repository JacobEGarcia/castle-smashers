<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASTLE SMASHERS</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#91c4df;color:#251d19;font:13px ui-monospace,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;padding:18px;pointer-events:none}.logo{font:900 clamp(30px,6vw,68px)/.8 sans-serif;letter-spacing:-.07em;color:#fff;text-shadow:4px 4px #6a3026}.logo span{color:#ffd45b}.stats{position:absolute;right:18px;top:18px;text-align:right;background:#fff8;padding:10px;border-radius:8px}.hp{width:230px;height:14px;border:3px solid #281e1a;background:#742b27}.hp i{display:block;height:100%;width:100%;background:#63bd57}.help{position:absolute;left:18px;bottom:18px;background:#fff9;padding:9px}.combo{position:absolute;right:18px;bottom:18px;font:900 34px sans-serif;color:#ffda59;text-shadow:3px 3px #6a3026}.start{position:fixed;inset:0;background:#95c8dce8;display:grid;place-items:center;text-align:center;z-index:4}.start.off{display:none}.start button{padding:13px 24px;border:3px solid #552d26;background:#ffd45b;font:inherit;font-weight:bold;cursor:pointer}.pick{display:flex;gap:8px;justify-content:center;margin:18px}.pick button{width:62px;height:62px;border-radius:50%;padding:0}.pick button.on{outline:5px solid white}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="logo">CASTLE <span>SMASHERS</span></div><div class="stats">WAVE <b id="wave">1</b> · GOLD <b id="gold">0</b><div class="hp"><i id="hp"></i></div></div><div class="help">A/D MOVE · J SLASH · K ELEMENT · SPACE JUMP</div><div class="combo" id="combo"></div></div><div class="start" id="start"><div><div class="logo">CASTLE <span>SMASHERS</span></div><p>Choose your elemental knight.</p><div class="pick"><button class="on" data-el="fire" style="background:#e8523e">FIRE</button><button data-el="ice" style="background:#58bddd">ICE</button><button data-el="storm" style="background:#f0cd48">STORM</button><button data-el="thorn" style="background:#65ad5d">THORN</button></div><button id="go">BEGIN RAID</button></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),$=s=>document.querySelector(s);let p={x:200,y:0,vy:0,hp:100,face:1,atk:0,el:'fire'},keys={},en=[],parts=[],run=false,gold=0,wave=1,combo=0,ct=0;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();document.querySelectorAll('[data-el]').forEach(b=>b.onclick=()=>{p.el=b.dataset.el;document.querySelectorAll('[data-el]').forEach(q=>q.classList.toggle('on',q===b))});$('#go').onclick=()=>{$('#start').classList.add('off');run=true;spawn()};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='j')attack(false);if(e.key.toLowerCase()==='k')attack(true);if(e.code==='Space'&&p.y===0)p.vy=-14};onkeyup=e=>keys[e.key.toLowerCase()]=0;function spawn(){en=[];for(let i=0;i<3+wave;i++)en.push({x:innerWidth+150+i*160,hp:35+wave*8,hit:0})}function attack(magic){p.atk=10;let range=magic?150:78;en.forEach(e=>{if(Math.abs(e.x-p.x)<range){e.hp-=magic?22:14;e.hit=8;combo++;ct=80;for(let i=0;i<12;i++)parts.push({x:e.x,y:innerHeight*.7-40,vx:(Math.random()-.5)*7,vy:-Math.random()*7,l:1})}})}function draw(t){let w=innerWidth,h=innerHeight,ground=h*.72;x.fillStyle='#8bc8e1';x.fillRect(0,0,w,h);x.fillStyle='#d7e8da';x.beginPath();x.moveTo(0,ground);for(let i=0;i<8;i++)x.lineTo(i*w/7,ground-90-(i%3)*55);x.lineTo(w,ground);x.fill();x.fillStyle='#81736b';x.fillRect(w*.72,ground-280,260,280);for(let i=0;i<4;i++)x.fillRect(w*.72+i*70,ground-320,45,60);x.fillStyle='#74a84f';x.fillRect(0,ground,w,h-ground);x.fillStyle='#5d7f3f';for(let i=0;i<w;i+=70)x.fillRect(i,ground+18,45,8);if(run){p.x+=((keys.d?1:0)-(keys.a?1:0))*5;p.face=keys.a?-1:keys.d?1:p.face;p.vy+=.75;p.y+=p.vy;if(p.y>0){p.y=0;p.vy=0}en.forEach(e=>{e.x+=Math.sign(p.x-e.x)*(1.1+wave*.12);if(Math.abs(e.x-p.x)<35&&Math.random()<.03){p.hp-=4;$('#hp').style.width=p.hp+'%'}e.hit--});en=en.filter(e=>{if(e.hp<=0){gold+=10;$('#gold').textContent=gold;return false}return true});if(!en.length){wave++;$('#wave').textContent=wave;spawn()}if(ct--<0){combo=0;$('#combo').textContent=''}else $('#combo').textContent=combo>1?combo+' HIT!':''}function knight(px,py,col){x.fillStyle=col;x.fillRect(px-16,py-44,32,40);x.fillStyle='#ddd';x.beginPath();x.arc(px,py-52,18,0,7);x.fill();x.strokeStyle='#342a27';x.lineWidth=4;x.stroke();x.fillStyle='#222';x.fillRect(px-8,py-56,4,4);x.fillRect(px+5,py-56,4,4)}let cols={fire:'#e6523e',ice:'#54bce0',storm:'#e8c843',thorn:'#62a957'};knight(p.x,ground+p.y,cols[p.el]);if(p.atk-->0){x.strokeStyle=cols[p.el];x.lineWidth=8;x.beginPath();x.arc(p.x+p.face*25,ground+p.y-30,42,-1.4,1.4);x.stroke()}en.forEach(e=>{knight(e.x,ground,e.hit>0?'#fff':'#6b4439');x.fillStyle='#b92e35';x.fillRect(e.x-20,ground-82,40*Math.max(0,e.hp)/(35+wave*8),4)});parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.3;q.l-=.04;x.fillStyle=cols[p.el];x.globalAlpha=q.l;x.fillRect(q.x,q.y,5,5)});x.globalAlpha=1;parts=parts.filter(q=>q.l>0);if(p.hp<=0){run=false;$('#start').classList.remove('off');$('#go').textContent='TRY AGAIN';p.hp=100;$('#hp').style.width='100%'}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
